<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>6宫格</title>
    <style>
      .six-grid {
        width: 100%;
      }

      .big-grid-item {
        width: 66.66%;
        float: left;
        box-sizing: border-box;
        padding: 40px;
        background-color: #ddd;
        transition: transform 0.3s ease; /* 添加过渡效果，使放大更平滑 */
      }

      .grid-item {
        width: 33.33%;
        float: left;
        box-sizing: border-box;
        padding: 20px;
        background-color: #eee;
      }

      .grid-item:nth-child(3n + 1) {
        clear: left;
      }

      /* 可以添加鼠标悬停效果 */
      .six-grid div:hover {
        cursor: pointer;
      }

      .six-grid.big-grid-item:hover {
        transform: scale(1.3); /* 鼠标悬停时更大的放大倍数 */
      }
    </style>
  </head>
  <body>
    <div class="six-grid">
      <div class="big-grid-item"></div>
      <div class="grid-item"></div>
      <div class="grid-item"></div>
      <div class="grid-item"></div>
      <div class="grid-item"></div>
      <div class="grid-item"></div>
    </div>
  </body>
</html>
