<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .tab-navs {
        display: flex;
        width: 300px;
      }
      .tab-nav-item {
        width: 50%;
        height: 40px;
      }
      .first-tab {
        background-color: red;
        border-top-right-radius: 6px;
      }
      .second-tab {
        background-color: blue;
        border-bottom-left-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div class="tab-navs">
      <div class="tab-nav-item first-tab"></div>
      <div class="tab-nav-item second-tab"></div>
    </div>
  </body>
</html>
