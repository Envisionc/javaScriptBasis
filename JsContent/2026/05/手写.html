            resolve('success');

        });

            console.log('then1');
            return 'then2';

        const ary = [1,2,3];
        const ary2 = [...ary];
        ary[0] = 2;
        
        ary.push(4); // 在数组后面添加一个元素，返回新数组长度  (原数组改变)
        ary.pop(); // 删除数组最后一个元素，返回删除的元素  (原数组改变)
        ary2.unshift(1); // 在数组前面添加一个元素，返回新数组长度  (原数组改变)
        ary2.shift(); // 删除数组第一个元素，返回删除的元素  (原数组改变)
